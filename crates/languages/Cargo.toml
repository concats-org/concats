[package]
name = "concats-languages"
publish.workspace = true
edition.workspace = true
version.workspace = true
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[lib]
name = "concats_languages"
path = "src/lib.rs"

[dependencies]
# The grammars are C, and C is why this cannot build for wasm32. Keeping them
# here lets the highlighting engine compile and test with none of them present,
# and makes adding a language a change to this crate only.
tree-sitter = { workspace = true, optional = true }

tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.23", optional = true }
tree-sitter-scala = { version = "0.24", optional = true }
tree-sitter-haskell = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-md = { version = "0.5", optional = true }

[dev-dependencies]
concats_syntax = { workspace = true }

[features]
default = ["grammars"]
# Every grammar, or none: no build ships a subset, and the names need none.
grammars = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-php",
    "dep:tree-sitter-html",
    "dep:tree-sitter-css",
    "dep:tree-sitter-scala",
    "dep:tree-sitter-haskell",
    "dep:tree-sitter-json",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-md",
]
