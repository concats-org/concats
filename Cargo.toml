[workspace]
resolver = "3"
members = [
    "crates/config",
    "crates/message",
    "crates/core",
    "crates/acp",
    "crates/hooks",
    "crates/registry",
    "crates/cli",
]
default-members = [
    "crates/config",
    "crates/message",
    "crates/core",
    "crates/acp",
    "crates/hooks",
    "crates/registry",
    "crates/cli",
]

[workspace.package]
publish = false
edition = "2024"
version = "0.0.0"


[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
style = "warn"
complexity = "warn"
cognitive_complexity = "warn"
pedantic = "warn"

[workspace.dependencies]
concats_config = { package = "concats-config", path = "crates/config" }
concats_message = { package = "concats-message", path = "crates/message" }
concats_core = { package = "concats-core", path = "crates/core" }
concats_acp = { package = "concats-acp", path = "crates/acp" }
concats_hooks = { package = "concats-hooks", path = "crates/hooks" }
concats_registry = { package = "concats-registry", path = "crates/registry" }
concats_cli = { package = "concats-cli", path = "crates/cli" }
async-trait = "0.1"
clap = { version = "4.5.31", features = ["derive"] }
console = "0.15.8"
dirs = "6"
documented = "0.9.2"
figment = { version = "0.10", features = ["toml", "env"] }
futures-util = "0.3"
git2 = { version = "0.20", features = ["ssh", "https"] }
ignore = "0.4"
indicatif = "0.18.3"
indoc = "2"
miette = { version = "7.6.0", features = ["fancy"] }
mockall = "0.14.0"
pest = "2.8.3"
pest_derive = "2.8.3"
proptest = "1.6.0"
rand = "0.9.2"
rayon = "1.11.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.20.0"
thiserror = "2.0.12"
time = { version = "0.3.39", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.43.0", features = [
    "fs",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "signal",
    "io-util",
] }
tokio-retry = "0.3.0"
tokio-stream = { version = "0.1.17", features = ["fs", "sync"] }
tokio-util = { version = "0.7.15", features = ["compat", "rt"] }
toml = "0.8"
tracing = "0.1.41"
tracing-indicatif = "0.3.6"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[patch.crates-io]
tui-widget-list = { git = "https://github.com/concats-org/tui-widget-list.git", branch = "scrolling" }

[profile.profiling]
inherits = "release"
debug = true
